<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | Contact Us</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">EduPortal.</a>

        <button class="menu-toggle" id="menu-toggle">☰</button>

        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="attendance.html">Attendance</a></li>
          <li><a href="timetable.html">Timetable</a></li>
          <li><a href="materials.html">Materials</a></li>
          <li><a href="notices.html">Notices</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="settings.html">Settings</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="admin-login.html">Admin</a></li>
          <li><a href="login.html" class="btn-login">Login</a></li>
        <li><a href="register.html" class="btn-login">Register</a></li>
          <li><a href="faq.html" class="btn-login">FAQ</a></li>


        </ul>
      </nav>
    </header>

    <main>
      <section class="page-header">
        <h1>Helpdesk & Support</h1>
        <p>Have questions or reporting an issue? Send us a query.</p>
      </section>

      <div class="form-container" style="max-width: 600px; margin: 0">
        <form id="contactForm" action="#" novalidate>
          <div class="form-group">
            <label for="subject">Issue Category</label>
            <select id="subject" name="subject">
              <option value="">Select an option</option>
              <option>Academic Inquiry</option>
              <option>Portal Technical Bug</option>
              <option>Attendance Correction</option>
            </select>
            <small class="error-message" id="subjectError"></small>
          </div>
          <div class="form-group">
            <label for="msg">Message</label>
            <textarea
              id="msg"
              name="msg"
              rows="4"
              placeholder="Describe your issue in detail..."
            ></textarea>
            <small class="error-message" id="messageError"></small>
          </div>
          <button type="submit" class="btn">Submit Query</button>
        </form>
      </div>
      <script src="javascript/script.js"></script>
    </main>
  </body>
</html>
