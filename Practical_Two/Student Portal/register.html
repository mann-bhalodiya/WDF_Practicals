<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | Registration</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">EduPortal.</a>

        <button class="menu-toggle" id="menu-toggle">☰</button>

        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="attendance.html">Attendance</a></li>
          <li><a href="timetable.html">Timetable</a></li>
          <li><a href="materials.html">Materials</a></li>
          <li><a href="notices.html">Notices</a></li>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="settings.html">Settings</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="admin-login.html">Admin</a></li>
          <li><a href="login.html" class="btn-login">Login</a></li>
          <li><a href="register.html" class="btn-login">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="form-container">
        <h2 style="margin-bottom: 0.5rem; text-align: center">
          Student Registration
        </h2>

        <p
          style="
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1.5rem;
          "
        >
          Create your student account by filling in the details below.
        </p>

        <form id="registrationForm" action="" method="GET" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="e.g., Alex Carry"
              maxlength="70"
              required
            />
            <small class="error-message" id="fullNameError"></small>
          </div>

          <div class="form-group">
            <label for="enrollment">Enrollment Number</label>
            <input
              type="text"
              id="enrollment"
              name="enrollment"
              placeholder="e.g., 2100012345"
              maxlength="10"
              required
            />
            <small class="error-message" id="enrollmentError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="e.g., alex@example.com"
              required
            />
            <small class="error-message" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="e.g., 9876543210"
              maxlength="10"
              required
            />
            <small class="error-message" id="phoneError"></small>
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select your course</option>
              <option value="btech">B.Tech</option>
              <option value="mca">MCA</option>
              <option value="bca">BCA</option>
              <option value="bba">BBA</option>
            </select>
            <small class="error-message" id="courseError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <small class="error-message" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repeat your password"
              required
            />
            <small class="error-message" id="confirmPasswordError"></small>
          </div>

          <button type="submit" class="btn">Register</button>
          <p
            style="
              margin-top: 1rem;
              text-align: center;
              color: var(--text-muted);
              font-size: 0.9rem;
            "
          >
            Already have an account?
            <a class="link-text" href="login.html">Login here</a>
          </p>
          <p
            class="success-message"
            id="registrationSuccess"
            style="
              display: none;
              color: #16a34a;
              text-align: center;
              margin-top: 1rem;
            "
          ></p>
        </form>
      </div>

      <script src="javascript/script.js"></script>
    </main>
  </body>
</html>
