<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - CSS Grid</title>
    <link rel="stylesheet" href="style_grid.css">
</head>

<body>

    <div class="dashboard">


        <header class="header">
            <h1>Student Dashboard</h1>
            <p>Responsive UI using CSS Grid</p>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>

            <a href="#">Dashboard</a>
            <a href="#">Attendance</a>
            <a href="#">Courses</a>
            <a href="#">Assignments</a>
            <a href="#">Profile</a>
        </aside>

        <main class="main-content">

            <h2>Welcome, Student!</h2>

            <div class="cards">

                <div class="card">
                    <h3>Attendance</h3>
                    <p>85%</p>
                </div>

                <div class="card">
                    <h3>Courses</h3>
                    <p>6</p>
                </div>

                <div class="card">
                    <h3>Assignments</h3>
                    <p>4 Pending</p>
                </div>

                <div class="card">
                    <h3>CGPA</h3>
                    <p>8.4</p>
                </div>

            </div>

            <section class="notice">
                <h2>Latest Notice</h2>
                <p>
                    The Web Development practical submission is due this week.
                </p>
            </section>

        </main>

        <footer class="footer">
            <p>© 2026 Student Portal</p>
        </footer>

    </div>

</body>
</html>
