<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                StudentHub
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                    id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-7">

                <div class="card shadow">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="text-center mb-3">
                            Student Registration
                        </h1>

                        <p class="text-center text-muted mb-4">
                            Create your StudentHub account
                        </p>


                        <form>


                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="firstName"
                                        class="form-label">

                                        First Name

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="firstName"
                                        placeholder="Enter first name">

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label
                                        for="lastName"
                                        class="form-label">

                                        Last Name

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="lastName"
                                        placeholder="Enter last name">

                                </div>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="student@example.com">

                            </div>


                            <div class="mb-3">

                                <label
                                    for="course"
                                    class="form-label">

                                    Select Course

                                </label>

                                <select
                                    class="form-select"
                                    id="course">

                                    <option selected>
                                        Choose a course
                                    </option>

                                    <option>
                                        Computer Engineering
                                    </option>

                                    <option>
                                        Information Technology
                                    </option>

                                    <option>
                                        Computer Science
                                    </option>

                                </select>

                            </div>


                            <!-- Gender -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <div>

                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="male">

                                        <label
                                            class="form-check-label"
                                            for="male">

                                            Male

                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="female">

                                        <label
                                            class="form-check-label"
                                            for="female">

                                            Female

                                        </label>

                                    </div>

                                </div>

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">

                                    Password

                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter password">

                            </div>


                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms">

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the terms and conditions.

                                </label>

                            </div>


                            <!-- Submit -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    Register

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            © 2026 StudentHub | Responsive UI using Bootstrap
        </p>

    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
